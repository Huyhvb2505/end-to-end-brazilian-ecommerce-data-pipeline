version: '3.8'

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: images/airflow/Dockerfile   
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-dw:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__LOGGING_LEVEL: 'INFO'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs     # Logs folder by airflow
    - ./scripts:/opt/airflow/scripts
    - ./olist_dbt:/opt/airflow/olist_dbt
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-dw:
      condition: service_healthy

services:
  # --- MINIO OBJECT STORAGE ---
  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: minio
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    

  # --- MINIO CLIENT (Tự động hóa tạo Bucket) ---
  minio-client:
    image: minio/mc:latest
    container_name: minio-client
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb myminio/${BUCKET_RAW} || true;
      /usr/bin/mc mb myminio/${BUCKET_PROCESSED} || true;
      /usr/bin/mc mb myminio/${BUCKET_MODELS} || true;
      exit 0;
      "
    

  # --- POSTGRES DATA WAREHOUSE ---
  # 1. PostgreSQL (Metadata + Data Warehouse)
  postgres-dw:
    image: postgres:16-alpine
    container_name: postgres-dw
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${AIRFLOW_DB_NAME},${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  #  Airflow Init 
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}

  #  Airflow Webserver 
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  #  Airflow Scheduler 
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully


  # --- JUPYTER LAB (MÔI TRƯỜNG DEV) ---
  jupyter:
    build:
      context: .
      dockerfile: images/jupyter/Dockerfile
    container_name: jupyter-lab
    ports:
      - "${JUPYTER_PORT}:8888"
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./data/raw:/home/jovyan/work/data/raw/
      - ./scripts:/home/jovyan/work/scripts
    depends_on:
      - minio
      - postgres-dw
  



volumes:
  minio_data:
  postgres_data:
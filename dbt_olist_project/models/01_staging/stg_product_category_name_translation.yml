version: 2

models:
  - name: stg_product_category_name_translation
    description: "Tầng Silver (Staging) - Bảng từ điển dịch thuật tên danh mục sản phẩm từ tiếng Bồ Đào Nha sang tiếng Anh."
    tests:
      - row_count_match:
          raw_source_name: 'raw'
          raw_table_name: 'product_category_name_translation'
          tolerance_percent: 0
    columns:
      - name: product_category_name
        data_type: text
        description: "Tên danh mục sản phẩm gốc bằng tiếng Bồ Đào Nha (Khóa chính của bảng)."
        tests:
          - unique
          - not_null

      - name: product_category_name_english
        data_type: text
        description: "Tên danh mục sản phẩm đã được dịch sang tiếng Anh."
        tests:
          - not_null

      - name: _ingested_at
        data_type: timestamp without time zone
        description: "Thời gian dữ liệu thô được nạp vào Bronze layer."